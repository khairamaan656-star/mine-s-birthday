<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:
linear-gradient(
135deg,
#2b1b17,
#4a2c2a,
#3d2623
);

position:relative;
}

#openBtn{

padding:16px 40px;

border:none;

border-radius:50px;

background:gold;

font-size:20px;

cursor:pointer;

font-weight:bold;

box-shadow:0 0 20px gold;

transition:.4s;

z-index:20;

}

#openBtn:hover{

transform:scale(1.1);

}

.scroll{

position:relative;

width:850px;
max-width:95%;

height:700px;

background:
linear-gradient(
to bottom,
#f7e7b4,
#f2d99c,
#eacb87
);

border-radius:10px;

padding:70px;

transform:scaleY(0);

transform-origin:top;

transition:2s;

overflow-y:auto;

box-shadow:
0 0 40px rgba(255,215,0,.3),
0 20px 50px rgba(0,0,0,.6);

border:10px solid #b8860b;

z-index:10;

}

.scroll::before{

content:"";

position:absolute;

top:0;
left:0;
right:0;
bottom:0;

background:
radial-gradient(circle at top left,
rgba(0,0,0,.12),
transparent 30%),

radial-gradient(circle at bottom right,
rgba(0,0,0,.12),
transparent 30%);

pointer-events:none;

}

.scroll.open{
transform:scaleY(1);
animation:unroll 2s ease forwards;
}

@keyframes unroll{

0%{
transform:scaleY(0) rotateX(90deg);
opacity:0;
}

100%{
transform:scaleY(1) rotateX(0deg);
opacity:1;
}

}

.scroll h1{

font-family:'Cinzel',serif;

text-align:center;

font-size:45px;

color:#5a3416;

margin-bottom:30px;

}

.message{

font-family:'Dancing Script','Times New Roman';

font-size:32px;

line-height:1.2;

color:#4b2e1e;

white-space:pre-wrap;

text-align:left;

}

@media(max-width:768px){

.message{
font-size:30px;
}

}

.message::after{
content:"|";
animation:blink .8s infinite;
}
.message.finished::after{
display:none;
}

@keyframes blink{
50%{
opacity:0;
}
}

.photo{

display:block;

width:250px;

margin:30px auto;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.3);

}

.nextBtn{

display:none;

margin-top:20px;

padding:15px 40px;

border:none;

border-radius:40px;

background:white;

color:#b8860b;

font-size:18px;

cursor:pointer;

z-index:20;

}

.candle{

position:absolute;

font-size:70px;

top:50%;

transform:translateY(-50%);

animation:flicker 1s infinite;

}

.left{
left:40px;
}

.right{
right:40px;
}

@keyframes flicker{

50%{
transform:
translateY(-50%)
scale(1.08);
}

}

.heart{

position:absolute;

pointer-events:none;

animation:heartFloat linear infinite;

}

@keyframes heartFloat{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

.petal{

position:absolute;

top:-50px;

font-size:30px;

pointer-events:none;

animation:petalFall linear forwards;

}

@keyframes petalFall{

0%{

transform:
translateY(0)
rotate(0deg);

}

100%{

transform:
translateY(120vh)
rotate(720deg);

opacity:0;

}

}

</style>
